[project]
name = "whoop-bridge"
version = "1.0.0"
description = "Read a WHOOP 4.0 strap over Bluetooth LE and forward the data to your own endpoint."
requires-python = ">=3.11"
# bleak already declares every winrt package it needs, each marked
# sys_platform == "win32", so naming them here is unnecessary -- and naming
# them without a marker breaks `pip install -e .` on Linux and macOS, where
# neither pywin32 nor winrt has any distribution at all.
dependencies = ["bleak>=0.22.0", "httpx>=0.27.0", "click>=8.1.0"]

[project.optional-dependencies]
tray = ["pystray>=0.19.0", "pillow>=10.0.0"]

[project.scripts]
whoop-bridge = "whoop_bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whoop_bridge*", "tray*"]
