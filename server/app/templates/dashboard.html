<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Strap</title>
<style>
/* Dark is the default look. Light is available via the toggle, and both
   palettes are defined explicitly so nothing inherits from the host. */
:root{
  --bg:#0d0d0d; --card:#1a1a19; --line:#2c2c2a; --axis:#383835;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --strain:#3987e5; --strain-dim:rgba(57,135,229,.20);
  --sleep:#d95926;  --sleep-dim:rgba(217,89,38,.20);
  --track:#2c2c2a;
  --r:16px;
}
:root[data-theme="light"]{
  --bg:#f9f9f7; --card:#fcfcfb; --line:#e1e0d9; --axis:#c3c2b7;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --strain:#2a78d6; --strain-dim:rgba(42,120,214,.18);
  --sleep:#eb6834;  --sleep-dim:rgba(235,104,52,.18);
  --track:#e1e0d9;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:max(10px,env(safe-area-inset-top)) 14px calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:6px 2px 16px}
h1{font-size:17px;margin:0;letter-spacing:-.01em;font-weight:650}
.hdr-r{display:flex;align-items:center;gap:10px}
.sub{color:var(--muted);font-size:11.5px}
button.icon{background:transparent;border:1px solid var(--line);color:var(--ink2);
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;
  display:grid;place-items:center;padding:0;flex:0 0 auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;margin-bottom:12px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  margin:0 0 14px;font-weight:600}

/* ---- hero ring ---- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:26px 18px 22px}
.hero .figure{font-size:64px;line-height:1;font-weight:600;letter-spacing:-.03em}
.hero .figure .pc{font-size:26px;font-weight:500;color:var(--muted);margin-left:2px}
.hero .band{margin-top:10px;font-size:14.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px}
.hero .band .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.hero .why{color:var(--muted);font-size:12.5px;margin-top:8px}
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap .inner{position:absolute;display:grid;place-items:center;text-align:center}

/* ---- small meters ---- */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.meter{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 14px;display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:9px}
.meter .txt{min-width:0;width:100%}
.meter .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.meter .val{font-size:25px;font-weight:600;line-height:1.1;margin-top:3px;
  letter-spacing:-.02em;white-space:nowrap}
.meter .val small{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
.meter .note{font-size:11px;color:var(--muted);margin-top:3px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat .val{font-size:27px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.stat .val small{font-size:13px;color:var(--muted);font-weight:400}
.stat .note{font-size:11px;color:var(--muted);margin-top:3px}
.delta{font-size:11.5px;margin-top:4px;display:inline-flex;align-items:center;gap:4px}

/* ---- suggestions ---- */
.sug{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--muted);
  border-radius:var(--r);padding:15px 17px;margin-bottom:10px}
.sug.warning{border-left-color:var(--crit)}
.sug.notice{border-left-color:var(--warn)}
.sug.info{border-left-color:var(--good)}
.sug .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sug .ic{font-size:15px;line-height:1}
.sug h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sug p{margin:0;color:var(--ink2);font-size:13px;line-height:1.55}
details.more{margin-top:9px}
details.more summary{color:var(--muted);font-size:11.5px;cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";font-size:9px;vertical-align:1px}
details.more[open] summary::before{content:"▾ "}
details.more p{margin-top:7px;font-size:12px;color:var(--muted)}

/* ---- chart ---- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--bg);
  border:1px solid var(--axis);border-radius:9px;padding:7px 10px;font-size:12px;
  white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5;
  box-shadow:0 4px 14px rgba(0,0,0,.35)}
.tip b{font-weight:600;font-variant-numeric:tabular-nums}
.tip .d{color:var(--muted);font-size:10.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ---- effect bars (insights) ---- */
.grp{margin-bottom:18px}
.grp:last-child{margin-bottom:0}
.grp-h{font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.04em;
  padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.grp-h span{color:var(--muted);font-weight:400}
.eff{padding:13px 0;border-bottom:1px solid var(--line)}
.eff:last-child{border-bottom:none}
.eff .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.eff .name{font-weight:600;font-size:14px}
.eff .amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.eff .amt.worse{color:var(--crit)} .eff .amt.better{color:var(--strain)}
.eff .track{position:relative;height:9px;background:var(--track);border-radius:5px}
.eff .track .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--axis)}
.eff .track i{position:absolute;top:0;height:9px;border-radius:4px}
.eff .track i.ci{opacity:.30;border-radius:5px}
.eff .track i.bar{box-shadow:0 0 0 2px var(--card)}
.eff .meta{font-size:11px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}

/* ---- lists / rows ---- */
.arow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:none}
.arow .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-size:17px;flex:0 0 auto;background:var(--strain-dim)}
.arow .m{flex:1 1 auto;min-width:0}
.arow .m .t{font-weight:600;font-size:14px}
.arow .m .s{color:var(--muted);font-size:11.5px;margin-top:2px}
.arow .go{flex:0 0 auto;color:var(--muted);font-size:17px}
.pill{font-size:9.5px;border:1px solid var(--line);border-radius:999px;padding:2px 7px;
  color:var(--muted);text-transform:uppercase;letter-spacing:.06em;vertical-align:1px}
.pill.ok{color:var(--good);border-color:var(--good)}

/* ---- forms ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);
  border-radius:999px;padding:9px 15px;font:inherit;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--strain);border-color:var(--strain);color:#fff}
input,textarea,select{background:var(--bg);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:10px 12px;font:inherit;font-size:13.5px;width:100%}
textarea{min-height:78px;resize:vertical}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.row>*{flex:1 1 auto;min-width:0}
.btn{background:var(--strain);border:none;color:#fff;padding:11px 18px;border-radius:10px;
  font:inherit;font-size:13.5px;font-weight:550;cursor:pointer;flex:0 0 auto}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink2);
  padding:9px 14px;font-weight:400}

/* ---- progress ---- */
.prog{margin-top:12px}
.prog .t{display:flex;justify-content:space-between;gap:10px;font-size:12px;
  color:var(--ink2);margin-bottom:7px}
.prog .t b{color:var(--ink);font-weight:600}
.prog .bar{height:8px;background:var(--track);border-radius:5px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--strain);border-radius:5px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:right;padding:9px 5px;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.07em}
tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.muted{color:var(--muted);font-size:12.5px;line-height:1.6}
.empty{color:var(--muted);text-align:center;padding:34px 14px;font-size:13.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---- bottom tab bar ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);
  border-top:1px solid var(--line);display:flex;
  padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
nav button{flex:1 1 0;background:none;border:none;color:var(--muted);cursor:pointer;
  font:inherit;font-size:10px;padding:5px 2px;display:flex;flex-direction:column;
  align-items:center;gap:3px;border-radius:10px;letter-spacing:.02em}
nav button .g{font-size:18px;line-height:1}
nav button[aria-selected="true"]{color:var(--ink)}
@media (min-width:680px){
  body{padding-bottom:30px}
  nav{position:static;border:1px solid var(--line);border-radius:999px;
    max-width:600px;margin:0 auto 16px;padding:5px}
  nav button{flex-direction:row;font-size:13px;padding:9px;gap:7px}
  nav button[aria-selected="true"]{background:var(--bg)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Strap</h1>
    <div class="hdr-r">
      <span class="sub" id="updated">loading…</span>
      <button class="icon" id="theme" title="Switch theme" aria-label="Switch theme">◐</button>
    </div>
  </header>
  <div id="content"><div class="empty">Loading…</div></div>
  <div class="muted" id="stats" style="margin-top:16px;font-size:11px"></div>
</div>

<nav id="nav">
  <button data-tab="today" aria-selected="true"><span class="g">◎</span>Today</button>
  <button data-tab="journal" aria-selected="false"><span class="g">✎</span>Journal</button>
  <button data-tab="activities" aria-selected="false"><span class="g">⚡</span>Activity</button>
  <button data-tab="insights" aria-selected="false"><span class="g">◈</span>Insights</button>
  <button data-tab="learning" aria-selected="false"><span class="g">◐</span>Learning</button>
</nav>

<script>
const $ = s => document.querySelector(s);
const fmt = (v,d=0) => v===null||v===undefined ? "–" : Number(v).toFixed(d);
const state = {tab:"today", date:new Date().toISOString().slice(0,10)};
const COMMON_TAGS = ["alcohol","caffeine","late_meal","late_screen","stress","travel",
  "sick","injury","nap","meditation","sauna","cold_plunge","social","early_night"];
const ACTIVITY_TYPES = ["run","walk","cycle","swim","lift","hiit","yoga","sport",
  "sleep","sedentary","other"];
const GLYPH = {run:"🏃",walk:"🚶",cycle:"🚲",swim:"🏊",lift:"🏋",hiit:"🔥",yoga:"🧘",
  sport:"⚽",sleep:"🌙",sedentary:"🪑",other:"•",hard_workout:"🔥",workout:"💪",cardio:"❤"};

function today(){ return new Date().toISOString().slice(0,10); }
function hhmm(u){ return new Date(u*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
// Deferred writes can fire after the node is gone (timers, late promises).
function say(sel,text){ const n=$(sel); if(n) n.textContent=text; }
function esc(s){ return String(s??"").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
async function api(path,opts){
  const r = await fetch(path,opts);
  if(!r.ok){ let m; try{ m=(await r.json()).detail; }catch(_){ m="HTTP "+r.status; } throw new Error(m); }
  return r.json();
}
function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// ---------- theme ----------
(function(){
  let saved=null; try{ saved=localStorage.getItem("strap-theme"); }catch(_){}
  if(saved) document.documentElement.setAttribute("data-theme",saved);
  $("#theme").onclick = () => {
    const next = document.documentElement.getAttribute("data-theme")==="light" ? "dark":"light";
    document.documentElement.setAttribute("data-theme",next);
    try{ localStorage.setItem("strap-theme",next); }catch(_){}
    render();
  };
})();

// ---------- ring ----------
function ringSVG(value, max, color, size, stroke){
  const r=(size-stroke)/2, C=2*Math.PI*r;
  const pct = value===null||value===undefined ? 0 : Math.max(0,Math.min(1,value/max));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
      stroke="${css('--track')}" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
      stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}
const BANDS = {green:{c:"var(--good)",t:"Recovered"},yellow:{c:"var(--warn)",t:"Adequate"},
               red:{c:"var(--crit)",t:"Low"}};

// ---------- line chart with hover ----------
function lineChart(points, opts){
  const o = Object.assign({h:150, color:css("--strain"), unit:"", label:"Value"}, opts||{});
  const vals = points.filter(p => p.v!==null && p.v!==undefined);
  if(vals.length < 2) return `<div class="empty">Not enough days yet.</div>`;
  const W=600, H=o.h, PAD={l:34,r:10,t:12,b:22};
  const lo=Math.min(...vals.map(p=>p.v)), hi=Math.max(...vals.map(p=>p.v));
  const span=(hi-lo)||1, y0=lo-span*0.15, y1=hi+span*0.15;
  const X=i=>PAD.l+(i/(points.length-1))*(W-PAD.l-PAD.r);
  const Y=v=>PAD.t+(1-(v-y0)/(y1-y0))*(H-PAD.t-PAD.b);
  const seg=[]; let open=false;
  points.forEach((p,i)=>{ if(p.v==null){open=false;return;}
    seg.push(`${open?"L":"M"} ${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`); open=true; });
  const ticks=[y0+(y1-y0)*0.15, (y0+y1)/2, y1-(y1-y0)*0.15];
  return `<div class="chart" data-chart='${esc(JSON.stringify({points,y0,y1,PAD,W,H,unit:o.unit,label:o.label}))}'>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="${esc(o.label)} over time">
      ${ticks.map(t=>`<line x1="${PAD.l}" x2="${W-PAD.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"
        stroke="${css('--line')}" stroke-width="1"/>
        <text x="${PAD.l-7}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end"
          fill="${css('--muted')}" font-size="10">${t.toFixed(0)}</text>`).join("")}
      <path d="${seg.join(" ")}" fill="none" stroke="${o.color}" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle class="cur" r="4.5" fill="${o.color}" stroke="${css('--card')}" stroke-width="2" opacity="0"/>
      <line class="cross" y1="${PAD.t}" y2="${H-PAD.b}" stroke="${css('--axis')}"
        stroke-width="1" opacity="0"/>
      <text x="${PAD.l}" y="${H-6}" fill="${css('--muted')}" font-size="10">${points[0].t}</text>
      <text x="${W-PAD.r}" y="${H-6}" text-anchor="end" fill="${css('--muted')}"
        font-size="10">${points[points.length-1].t}</text>
      <rect class="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    </svg>
    <div class="tip"></div>
  </div>`;
}

function wireCharts(root){
  root.querySelectorAll(".chart[data-chart]").forEach(box => {
    const cfg = JSON.parse(box.dataset.chart);
    const svg = box.querySelector("svg"), tip = box.querySelector(".tip");
    const cur = box.querySelector(".cur"), cross = box.querySelector(".cross");
    const {points,y0,y1,PAD,W,H} = cfg;
    const X=i=>PAD.l+(i/(points.length-1))*(W-PAD.l-PAD.r);
    const Y=v=>PAD.t+(1-(v-y0)/(y1-y0))*(H-PAD.t-PAD.b);
    const move = e => {
      const rect = svg.getBoundingClientRect();
      const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const vx = cx / rect.width * W;
      let best=-1, bd=1e9;
      points.forEach((p,i)=>{ if(p.v==null) return;
        const d=Math.abs(X(i)-vx); if(d<bd){bd=d;best=i;} });
      if(best<0) return;
      const p=points[best];
      cur.setAttribute("cx",X(best)); cur.setAttribute("cy",Y(p.v));
      cur.setAttribute("opacity","1");
      cross.setAttribute("x1",X(best)); cross.setAttribute("x2",X(best));
      cross.setAttribute("opacity","1");
      tip.innerHTML = `<b>${p.v}${cfg.unit}</b> <span class="d">${p.t}</span>`;
      tip.style.opacity="1";
      const px = X(best)/W*rect.width;
      tip.style.left = Math.max(0, Math.min(rect.width-tip.offsetWidth, px-tip.offsetWidth/2))+"px";
      tip.style.top = Math.max(0, Y(p.v)/H*rect.height - tip.offsetHeight - 10)+"px";
    };
    const hide = () => { tip.style.opacity="0"; cur.setAttribute("opacity","0");
                         cross.setAttribute("opacity","0"); };
    svg.addEventListener("mousemove",move);
    svg.addEventListener("mouseleave",hide);
    svg.addEventListener("touchmove",move,{passive:true});
    svg.addEventListener("touchend",hide);
  });
}

// ---------- Today ----------
async function renderToday(el, stale){
  const [data, advice] = await Promise.all([
    api("/api/summary?days=14"),
    api("/api/advice").catch(e=>({ready:false, reason:e.message, suggestions:[]}))
  ]);
  if(stale()) return;
  const days = data.days.filter(d=>d.has_data);
  if(!days.length){
    el.innerHTML = `<div class="card"><div class="empty">No data yet.<br><br>
      Once the laptop bridge forwards a sync, everything appears here.</div></div>`;
    return;
  }
  const t=days[0], rec=t.recovery||{}, band=BANDS[rec.band]||{c:"var(--muted)",t:"Not enough data"};
  const prev = days[1];
  const sh=Math.floor((t.sleep.total_minutes||0)/60), sm=(t.sleep.total_minutes||0)%60;
  const strainPct = t.strain.score;

  const ICON={warning:"⚠",notice:"●",info:"✓"};
  const sugHTML = (advice.ready && advice.suggestions.length)
    ? advice.suggestions.map(s=>`<div class="sug ${s.severity}">
        <div class="top"><span class="ic">${ICON[s.severity]||"•"}</span><h3>${esc(s.headline)}</h3></div>
        <p>${esc(s.detail)}</p>
        <details class="more"><summary>confidence: ${s.confidence}</summary>
          <p>${esc(advice.disclaimer)}</p></details>
      </div>`).join("")
    : "";

  let html = `<div class="card hero">
    <div class="ringwrap">
      ${ringSVG(rec.score, 100, band.c==="var(--good)"?css("--good"):band.c==="var(--warn)"?css("--warn"):band.c==="var(--crit)"?css("--crit"):css("--muted"), 200, 16)}
      <div class="inner">
        <div class="figure">${rec.score ?? "–"}${rec.score!=null?'<span class="pc">%</span>':""}</div>
        <div class="sub" style="margin-top:2px">Recovery</div>
      </div>
    </div>
    <div class="band"><span class="dot" style="background:${band.c}"></span>${band.t}</div>
    <div class="why">${rec.score==null ? esc(rec.note||"not enough data")
      : `HRV ${fmt(rec.components.hrv)} · Resting HR ${fmt(rec.components.resting_hr)} · Sleep ${fmt(rec.components.sleep)}`}</div>
  </div>

  <div class="meters">
    <div class="meter">
      <div class="ringwrap">${ringSVG(strainPct,21,css("--strain"),72,8)}</div>
      <div class="txt"><div class="lbl">Strain</div>
        <div class="val">${fmt(strainPct,1)}<small> / 21</small></div>
        <div class="note">${strainPct>=15?"hard day":strainPct>=9?"moderate":"light"}</div></div>
    </div>
    <div class="meter">
      <div class="ringwrap">${ringSVG(t.sleep.performance_pct,100,css("--sleep"),72,8)}</div>
      <div class="txt"><div class="lbl">Sleep</div>
        <div class="val">${sh}<small>h </small>${sm}<small>m</small></div>
        <div class="note">${t.sleep.performance_pct!=null?`${fmt(t.sleep.performance_pct)}% of ${t.sleep.need_hours}h`:"none detected"}</div></div>
    </div>
  </div>

  ${sugHTML}

  <div class="stats">
    ${statTile("HRV",fmt(t.hrv.rmssd_ms,1),"ms",t.hrv.rmssd_ms,prev&&prev.hrv.rmssd_ms,true,
      `${t.baselines.hrv_rmssd_ms?`baseline ${fmt(t.baselines.hrv_rmssd_ms,1)}`:"building baseline"}`)}
    ${statTile("Resting HR",fmt(t.heart_rate.resting,1),"bpm",t.heart_rate.resting,
      prev&&prev.heart_rate.resting,false,
      `${t.baselines.resting_hr?`baseline ${fmt(t.baselines.resting_hr,1)}`:"building baseline"}`)}
  </div>

  <div class="card"><h2>HRV — last ${data.days.length} days</h2>
    ${lineChart(data.days.slice().reverse().map(d=>({t:d.date.slice(5),
      v:d.has_data&&d.hrv.rmssd_ms!=null?d.hrv.rmssd_ms:null})),
      {color:css("--strain"), unit:" ms", label:"HRV RMSSD"})}
    <div class="legend"><span><i style="background:${css('--strain')}"></i>HRV (RMSSD), ms</span></div>
  </div>

  <div class="card"><h2>Recent days</h2><div class="scroll"><table>
    <tr><th>Date</th><th>Recovery</th><th>Strain</th><th>Sleep</th><th>HRV</th><th>RHR</th></tr>
    ${days.map(d=>{const b=BANDS[d.recovery.band];
      return `<tr><td>${d.date.slice(5)}</td>
      <td>${b?`<span class="dot" style="background:${b.c};margin-right:5px"></span>`:""}${d.recovery.score ?? "–"}</td>
      <td>${fmt(d.strain.score,1)}</td>
      <td>${Math.floor((d.sleep.total_minutes||0)/60)}h ${(d.sleep.total_minutes||0)%60}m</td>
      <td>${fmt(d.hrv.rmssd_ms,1)}</td><td>${fmt(d.heart_rate.resting,1)}</td></tr>`;}).join("")}
  </table></div></div>

  <details class="more"><summary>How these numbers are made</summary>
    <p>Recovery, strain and sleep are computed on this server from raw sensor data
    using published methods. They are not WHOOP's values and will not match the
    official app. SpO₂, skin temperature and respiratory rate are raw sensor counts,
    not real-world units. Not medical measurements.</p></details>`;

  el.innerHTML = html;
  wireCharts(el);
  say("#stats", statsLine(data.stats));
}

function statTile(label, value, unit, now, before, higherBetter, note){
  let delta = "";
  if(now!=null && before!=null){
    const d = now-before, good = higherBetter ? d>0 : d<0;
    if(Math.abs(d) >= 0.05)
      delta = `<div class="delta" style="color:${good?css('--good'):css('--crit')}">
        ${d>0?"▲":"▼"} ${Math.abs(d).toFixed(1)} vs yesterday</div>`;
  }
  return `<div class="stat"><div class="lbl">${label}</div>
    <div class="val">${value}<small> ${unit}</small></div>
    ${delta}<div class="note">${note}</div></div>`;
}

function statsLine(s){
  return `${s.records.toLocaleString()} records · ${s.events.toLocaleString()} events` +
    (s.last_ingest ? ` · last sync ${s.last_ingest.at} UTC` : " · no sync yet");
}

// ---------- Journal ----------
async function renderJournal(el, stale){
  const [entry, all] = await Promise.all([
    api(`/api/journal/${state.date}`), api("/api/journal?days=30")
  ]);
  if(stale()) return;
  const known = Array.from(new Set([...COMMON_TAGS, ...(all.known_tags||[])])).sort();
  const chosen = new Set(entry.tags||[]);
  el.innerHTML = `
  <div class="card">
    <div class="row" style="margin-bottom:16px">
      <input type="date" id="jdate" value="${state.date}" max="${today()}" style="flex:0 0 auto;width:auto">
      <span class="muted" id="jsaved" style="flex:1 1 auto;text-align:right"></span>
    </div>
    <h2>What happened today</h2>
    <div class="chips" id="tags">${known.map(t=>`<button class="chip" data-tag="${esc(t)}"
      aria-pressed="${chosen.has(t)}">${esc(t.replace(/_/g," "))}</button>`).join("")}</div>
    <div class="row" style="margin:14px 0 0">
      <input id="newtag" placeholder="add your own…">
      <button class="btn ghost" id="addtag">Add</button>
    </div>
  </div>
  <div class="card"><h2>Notes</h2>
    <textarea id="jnotes" placeholder="Anything worth remembering…">${esc(entry.notes||"")}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn" id="jsave">Save day</button></div>
    <div class="muted" style="margin-top:14px">Log ordinary days too. A factor can only
      be tested if there are days both with and without it.</div>
  </div>
  <div class="card"><h2>Last 30 days</h2>
    ${all.entries.length ? all.entries.slice().reverse().slice(0,14).map(e=>`
      <div class="arow"><div class="ic" style="background:var(--sleep-dim)">✎</div>
        <div class="m"><div class="t">${e.date.slice(5)}</div>
          <div class="s">${esc((e.tags||[]).join(", ")||"nothing logged")}</div></div></div>`).join("")
      : `<div class="muted">Nothing logged yet.</div>`}
  </div>`;

  $("#tags").onclick = e => { const b=e.target.closest("[data-tag]"); if(!b) return;
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")==="true"?"false":"true"); };
  $("#addtag").onclick = () => {
    const v=$("#newtag").value.trim().toLowerCase().replace(/\s+/g,"_");
    if(!v || $(`[data-tag="${v}"]`)) return;
    $("#tags").insertAdjacentHTML("beforeend",
      `<button class="chip" data-tag="${esc(v)}" aria-pressed="true">${esc(v.replace(/_/g," "))}</button>`);
    $("#newtag").value="";
  };
  $("#jdate").onchange = e => { state.date=e.target.value; render(); };
  $("#jsave").onclick = async () => {
    const tags=Array.from(document.querySelectorAll('[data-tag][aria-pressed="true"]')).map(b=>b.dataset.tag);
    try{
      await api(`/api/journal/${state.date}`,{method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({tags,amounts:{},notes:$("#jnotes").value})});
      say("#jsaved","saved ✓"); setTimeout(()=>say("#jsaved",""),2000);
    }catch(err){ say("#jsaved","save failed: "+err.message); }
  };
}

// ---------- Activities ----------
async function renderActivities(el, stale){
  const data = await api(`/api/activities?date=${state.date}`);
  if(stale()) return;
  const rows = data.activities;
  el.innerHTML = `
  <div class="card">
    <div class="row" style="margin-bottom:14px">
      <input type="date" id="adate" value="${state.date}" max="${today()}" style="flex:0 0 auto;width:auto">
      <button class="btn ghost" id="redetect" style="flex:0 0 auto">Re-scan</button>
    </div>
    <h2>Detected by ${data.source}</h2>
    ${rows.length ? rows.map(actRow).join("")
      : `<div class="empty">Nothing detected for this day.</div>`}
    <div class="muted" style="margin-top:14px">Tap a row to correct it. Confirming or
      correcting is what trains the classifier — your edits are never overwritten.</div>
  </div>
  <div class="card"><h2>Add manually</h2>
    <div class="row"><select id="mtype">${ACTIVITY_TYPES.map(t=>`<option>${t}</option>`).join("")}</select></div>
    <div class="row" style="margin-top:9px">
      <input type="time" id="mstart" value="12:00"><input type="time" id="mend" value="13:00"></div>
    <div class="row" style="margin-top:9px"><input id="mnote" placeholder="note (optional)"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="madd">Add</button>
      <span class="muted" id="mmsg" style="text-align:right"></span></div>
    <div class="muted" style="margin-top:12px">For things the strap could not see — an
      off-wrist class, or an event you want on the record.</div>
  </div>`;

  $("#adate").onchange = e => { state.date=e.target.value; render(); };
  $("#redetect").onclick = async () => {
    await api(`/api/activities/detect?date=${state.date}`,{method:"POST"}); render(); };
  el.querySelectorAll("[data-act]").forEach(node=>{
    const id=node.dataset.act;
    node.querySelector(".head").onclick = () => {
      const p=node.querySelector(".edit"); p.hidden = !p.hidden; };
    node.querySelector(".save").onclick = async () => {
      try{
        await api(`/api/activities/${id}`,{method:"PATCH",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({confirmed_type:node.querySelector(".type").value,
                               note:node.querySelector(".note").value})});
        render();
      }catch(err){ alert("Could not save: "+err.message); }
    };
    node.querySelector(".del").onclick = async () => {
      await api(`/api/activities/${id}`,{method:"DELETE"}); render(); };
  });
  $("#madd").onclick = async () => {
    const base=Math.floor(new Date(state.date+"T00:00:00Z").getTime()/1000);
    const [sh,sm]=$("#mstart").value.split(":").map(Number);
    const [eh,em]=$("#mend").value.split(":").map(Number);
    let start=base+sh*3600+sm*60, end=base+eh*3600+em*60;
    if(end<=start) end+=86400;
    try{
      await api("/api/activities",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({start_unix:start,end_unix:end,
          activity_type:$("#mtype").value,note:$("#mnote").value})});
      render();
    }catch(err){ say("#mmsg","failed: "+err.message); }
  };
}

function actRow(a){
  const mins=Math.round((a.end_unix-a.start_unix)/60);
  const label=a.confirmed_type||a.detected_type||"unknown";
  const opts=Array.from(new Set([...ACTIVITY_TYPES,label]))
    .map(t=>`<option ${t===label?"selected":""}>${esc(t)}</option>`).join("");
  const intensity = Math.min(1,(a.features&&a.features.hr_reserve_mean)||0);
  return `<div data-act="${a.id}">
    <div class="arow head" style="cursor:pointer">
      <div class="ic" style="background:${intensity>0.5?'var(--sleep-dim)':'var(--strain-dim)'}">
        ${GLYPH[label]||"•"}</div>
      <div class="m">
        <div class="t">${esc(label.replace(/_/g," "))}
          ${a.confirmed_type?'<span class="pill ok">confirmed</span>':""}</div>
        <div class="s">${hhmm(a.start_unix)} – ${hhmm(a.end_unix)} · ${mins} min${
          a.confirmed_type?"":` · ${Math.round((a.confidence||0)*100)}% sure`}${
          a.note?` · ${esc(a.note)}`:""}</div>
      </div>
      <div class="go">›</div>
    </div>
    <div class="edit" hidden style="padding:0 0 14px">
      <div class="row"><select class="type">${opts}</select></div>
      <div class="row" style="margin-top:8px">
        <input class="note" placeholder="note" value="${esc(a.note||"")}"></div>
      <div class="row" style="margin-top:9px">
        <button class="btn save">Save</button>
        <button class="btn ghost del" style="flex:0 0 auto">Delete</button></div>
    </div>
  </div>`;
}

// ---------- Insights ----------
async function renderInsights(el, stale){
  const data = await api("/api/insights?days=90&lag=1");
  if(stale()) return;
  if(!data.ready){
    el.innerHTML = `<div class="card"><h2>What helps and what hurts</h2>
      <div class="empty">Not yet — ${esc(data.reason)}.<br><br>
      This compares days you logged something against days you did not, so it needs
      a stretch of journalled days first.</div></div>`;
    return;
  }
  const sig=data.signals, rest=data.findings.filter(f=>!f.significant);
  el.innerHTML = `
  <div class="card"><h2>What helps and what hurts</h2>
    ${sig.length ? groups(sig)
      : `<div class="empty">No factor cleared the bar yet. That is a real result —
         with ${data.pairs} days and ${data.tests_run} tests, weak effects cannot be
         told apart from noise.</div>`}
    ${sig.length?`<div class="legend">
      <span><i style="background:${css('--crit')}"></i>worse next day</span>
      <span><i style="background:${css('--strain')}"></i>better next day</span>
      <span><i style="background:${css('--axis')}"></i>95% confidence range</span></div>`:""}
  </div>
  ${rest.length?`<div class="card"><h2>Tested — no clear signal</h2>
    ${groups(rest,true)}</div>`:""}
  <div class="card"><h2>Method</h2>
    <div class="muted">${esc(data.caveat)}</div>
    <details class="more"><summary>How the test works</summary>
      <p>Each factor on one day is tested against the next day's outcome
      (lag ${data.lag_days}d) with a permutation test and a bootstrap confidence
      interval. q is the false-discovery-rate-adjusted p-value across all
      ${data.tests_run} tests; a factor counts as a signal at q ≤ ${data.fdr_q}.
      ${data.pairs} journalled days used. Bars are scaled within each outcome —
      points, bpm, minutes and ms are different units and never share an axis.</p>
    </details>
  </div>`;
}

// Group by outcome so each measure gets its own scale. Recovery points and sleep
// minutes on one shared axis would render a real 27-point effect as a sliver.
function groups(findings, dim){
  const by = {};
  findings.forEach(f => { (by[f.outcome] = by[f.outcome] || []).push(f); });
  return Object.values(by).map(list => {
    const scale = Math.max(1e-6, ...list.map(f => Math.max(
      Math.abs(f.difference), Math.abs(f.ci_low), Math.abs(f.ci_high))));
    return `<div class="grp">
      <div class="grp-h">${esc(list[0].outcome_label)} <span>${esc(list[0].unit)}</span></div>
      ${list.map(f => effBar(f, scale, dim)).join("")}
    </div>`;
  }).join("");
}

function effBar(f, scale, dim){
  const worse = f.direction==="worse";
  const color = dim ? css("--muted") : (worse ? css("--crit") : css("--strain"));
  const half=50, pos=v => half + (v/scale)*half*0.92;   // 0.92 keeps ends off the edge
  const d=pos(f.difference), lo=pos(Math.min(f.ci_low,f.ci_high)), hi=pos(Math.max(f.ci_low,f.ci_high));
  const barL=Math.min(half,d), barW=Math.abs(d-half);
  return `<div class="eff">
    <div class="h"><span class="name">${esc(f.factor.replace(/_/g," "))}</span>
      <span class="amt ${dim?"":(worse?"worse":"better")}">
        ${f.difference>0?"+":""}${f.difference}</span></div>
    <div class="track">
      <i class="ci" style="left:${lo}%;width:${Math.max(0.8,hi-lo)}%;background:${color}"></i>
      <i class="bar" style="left:${barL}%;width:${Math.max(1.5,barW)}%;background:${color}"></i>
      <span class="mid"></span>
    </div>
    <div class="meta">95% CI [${f.ci_low}, ${f.ci_high}] · ${f.n_with} with,
      ${f.n_without} without · q=${f.q_value}</div>
  </div>`;
}

// ---------- Learning ----------
async function renderLearning(el, stale){
  const d = await api("/api/learning?days=60");
  if(stale()) return;
  const a=d.activity_recognition, i=d.lifestyle_insights;
  const aPct = Math.round(100*a.labelled_total/((a.labelled_total+a.labels_needed)||1));
  const iPct = Math.round(100*i.usable_pairs/((i.usable_pairs+i.pairs_needed)||1));
  el.innerHTML = `
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <h2 style="margin:0">Activity recognition</h2>
      <span class="pill ${a.active?"ok":""}">${a.active?"learning":"rules"}</span>
    </div>
    ${a.active ? `<div class="muted">Trained on <b style="color:var(--ink)">${a.labelled_total}</b>
        confirmed activities across ${esc(a.ready_classes.join(", "))}.
        Cross-validated accuracy ${Math.round((a.model_accuracy||0)*100)}%.</div>`
      : `<div class="prog">
          <div class="t"><span>${esc(a.blocker||"")}</span><b>${esc(a.eta.text)}</b></div>
          <div class="bar"><i style="width:${Math.max(3,aPct)}%"></i></div>
          <div class="muted" style="margin-top:9px">
            <b style="color:var(--ink)">${a.labels_needed}</b> more confirmations needed.
            ${esc(a.note)}</div></div>`}
    ${Object.keys(a.counts||{}).length?`<div class="muted" style="margin-top:12px">
      Confirmed: ${Object.entries(a.counts).map(([k,v])=>`${esc(k)} ${v}`).join(" · ")}</div>`:""}
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="train">Retrain now</button>
      <span class="muted" id="tmsg" style="text-align:right"></span></div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <h2 style="margin:0">Lifestyle insights</h2>
      <span class="pill ${i.active?"ok":""}">${i.active?"running":"waiting"}</span>
    </div>
    ${i.active ? `<div class="muted"><b style="color:var(--ink)">${i.journalled_days}</b>
        journalled days. Testable: ${esc(i.testable_factors.join(", "))}.</div>`
      : `<div class="prog">
          <div class="t"><span>${esc(i.blocker||"")}</span><b>${esc(i.eta.text)}</b></div>
          <div class="bar"><i style="width:${Math.max(3,iPct)}%"></i></div>
          <div class="muted" style="margin-top:9px">${esc(i.note)}</div></div>`}
    ${Object.keys(i.factors_not_yet_testable||{}).length?`<div class="muted" style="margin-top:12px">
      Not yet testable: ${Object.entries(i.factors_not_yet_testable)
        .map(([k,v])=>`${esc(k)} (${esc(v.needs)})`).join(" · ")}</div>`:""}
  </div>`;
  $("#train").onclick = async () => {
    say("#tmsg","training…");
    try{
      const r=await api("/api/model/train",{method:"POST"});
      say("#tmsg", r.trained ? `trained on ${r.n_samples}, ${Math.round(r.cv_accuracy*100)}% accurate`
                             : r.reason);
    }catch(err){ say("#tmsg","failed: "+err.message); }
    setTimeout(render,1500);
  };
}

// ---------- shell ----------
const TABS={today:renderToday, journal:renderJournal, activities:renderActivities,
            insights:renderInsights, learning:renderLearning};
// A slow render must never overwrite a tab the user has since switched to.
let renderToken = 0;
async function render(){
  const my = ++renderToken, tab = state.tab, el = $("#content");
  const stale = () => my !== renderToken;
  el.innerHTML = `<div class="empty">Loading…</div>`;
  try{
    await TABS[tab](el, stale);
    if(stale()) return;
    say("#updated","updated "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    if(stale()) return;
    el.innerHTML = `<div class="card"><div class="empty">Could not load: ${esc(e.message)}</div></div>`;
    say("#updated","error");
  }
}
$("#nav").onclick = e => {
  const b=e.target.closest("[data-tab]"); if(!b) return;
  state.tab=b.dataset.tab;
  document.querySelectorAll("#nav button").forEach(x=>
    x.setAttribute("aria-selected", String(x===b)));
  render();
};
render();
setInterval(()=>{ if(state.tab==="today") render(); }, 60000);
